name: Publish
on:
  push:
    tags:
      - v*
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  publish-pypi:
    runs-on: ubuntu-26.04
    if: ${{ github.repository_owner == 'monosans' }}
    permissions:
      id-token: write # to attest the build and publish to PyPI with trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # Publish only a tag that matches the version and is on main.
      - run: grep -Fqx "__version__ = \"${GITHUB_REF_NAME#v}\"" src/pywttr/__init__.py
      - run: git merge-base --is-ancestor HEAD origin/main
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: false
      - run: uv build --no-cache
      - uses: astral-sh/attest-action@39b6ce43875c196a579e31635b11aa2a2036384a # v0.0.7
      - run: uv publish --trusted-publishing always --no-cache
