[project]
name = "pywttr"
description = "Typed Python client for the wttr.in weather API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "monosans", email = "hsyqixco@protonmail.com" }]
keywords = [
  "api-client",
  "forecast",
  "httpx",
  "pydantic",
  "weather",
  "weather-api",
  "wttr",
  "wttr-in",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: Pydantic",
  "Framework :: Pydantic :: 2",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: 3.16",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
urls.changelog = "https://github.com/monosans/pywttr/blob/main/CHANGELOG.md"
urls.documentation = "https://monosans.github.io/pywttr"
urls.issues = "https://github.com/monosans/pywttr/issues"
urls.repository = "https://github.com/monosans/pywttr"
dependencies = [
  "httpx2>=2.0.0",
  "pydantic>=2.5",
  "pywttr-models>=2.1.1,<3",
  "typing-extensions>=4.4; python_version < '3.13'"
]
dynamic = ["version"]

[dependency-groups]
dev = [
  "covdefaults==2.3",
  "mypy==2.4.1",
  "pytest-cov==7.1.0",
  "ruff==0.17.5",
  { include-group = "test" },
]
docs = [
  "mkdocstrings==1.0.8",
  "mkdocstrings-python==2.0.11",
  "ruff==0.17.5",
  "zensical==0.1.1",
]
test = ["pytest==9.2.0", "pytest-rerunfailures==16.7", "pytest-xdist==3.8"]
test-ci = [
  "pytest-github-actions-annotate-failures==0.4.2",
  { include-group = "test" },
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
only-include = ["src"]

[tool.hatch.version]
path = "src/pywttr/__init__.py"

[tool.uv]
exclude-newer = "3 days"

[tool.uv.sources]
pywttr-models = { git = "https://github.com/monosans/pywttr-models", branch = "main" }
